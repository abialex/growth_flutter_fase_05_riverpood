name: CI

on:
  push:
  # Pull requests to main receive the complete validation below.
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Install workspace dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze packages
        run: dart run melos run analyze

  validate:
    name: Validate pull request
    needs: quality
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Install workspace dependencies
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Create CI environment file
        working-directory: apps/app
        run: cp .env.example .env

      - name: Build Android APK
        working-directory: apps/app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: apps/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

# No se ejecuta build_runner: esta fase no contiene generación de código.
